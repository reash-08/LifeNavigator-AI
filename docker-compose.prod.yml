# LifeNavigator-AI Production Orchestration
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # 1. Primary PostgreSQL 16 + pgvector Database
  db:
    image: pgvector/pgvector:pg16
    container_name: lifenavigator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifenavigator}
      POSTGRES_USER: ${POSTGRES_USER:-lifenavigator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lifenavigator-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lifenavigator} -d $${POSTGRES_DB:-lifenavigator}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Dedicated Single-Run Database Migration Service (prevents multi-worker race conditions)
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifenavigator-migration
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be provided}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lifenavigator-net

  # 3. FastAPI Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifenavigator-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be provided}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-life-navigator-ai}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-life-navigator-ai-api}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-3/hour}
      RATE_LIMIT_AGENT: ${RATE_LIMIT_AGENT:-20/minute}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.1}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.6}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - lifenavigator-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. Production Nginx Static & Reverse-Proxy Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lifenavigator-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lifenavigator-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: lifenavigator_postgres_data

networks:
  lifenavigator-net:
    name: lifenavigator_network
    driver: bridge
